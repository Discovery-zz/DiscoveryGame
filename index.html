<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Discovery Game</title>


    <!-- =========================
         LINE LIFF SDK
    ========================== -->

    <script
        src="https://static.line-scdn.net/liff/edge/2/sdk.js">
    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 20px;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f5f1e8;

            font-family:
                Arial,
                "Noto Sans JP",
                sans-serif;
        }


        .game {

            width: 100%;

            max-width: 400px;

            padding: 30px 20px;

            text-align: center;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 5px 25px
                rgba(0, 0, 0, 0.12);
        }


        h1 {

            margin-top: 0;

            margin-bottom: 10px;
        }


        #lineUser {

            min-height: 24px;

            margin:
                10px 0 5px;

            font-size: 16px;

            font-weight: bold;
        }


        #liffStatus {

            min-height: 20px;

            margin-bottom: 15px;

            color: #777;

            font-size: 13px;
        }


        #number {

            width: 180px;

            height: 180px;

            margin: 30px auto;


            display: flex;

            justify-content: center;

            align-items: center;


            border:
                4px solid #222;

            border-radius: 20px;


            font-size: 70px;

            font-weight: bold;


            background: #fafafa;
        }


        button {

            width: 100%;

            height: 55px;

            border: none;

            border-radius: 10px;


            background: #222;

            color: white;


            font-size: 20px;

            font-weight: bold;


            cursor: pointer;
        }


        button:active {

            transform:
                scale(0.98);
        }


        #message {

            margin-top: 20px;

            min-height: 24px;

            font-size: 16px;
        }


        .score {

            margin-top: 30px;

            font-size: 20px;

            font-weight: bold;
        }


    </style>

</head>


<body>


<div class="game">


    <!-- =========================
         标题
    ========================== -->

    <h1>
        Discovery Game
    </h1>


    <!-- =========================
         LINE 用户名
    ========================== -->

    <p id="lineUser">

        LINEに接続しています...

    </p>


    <!-- =========================
         LIFF 状态
    ========================== -->

    <p id="liffStatus">

        LIFFを初期化しています...

    </p>


    <!-- =========================
         游戏说明
    ========================== -->

    <p>

        数字を見つけよう！

    </p>


    <!-- =========================
         数字
    ========================== -->

    <div id="number">

        ?

    </div>


    <!-- =========================
         START
    ========================== -->

    <button id="startButton">

        START

    </button>


    <!-- =========================
         消息
    ========================== -->

    <p id="message">

        STARTを押してください

    </p>


    <!-- =========================
         SCORE
    ========================== -->

    <div class="score">

        SCORE：
        <span id="score">0</span>

    </div>


</div>


<script>


    // ==================================================
    // LIFF 设置
    // ==================================================

    const LIFF_ID = "2011739996";


    // ==================================================
    // 游戏变量
    // ==================================================

    let score = 0;


    // ==================================================
    // 获取 HTML 元素
    // ==================================================

    const numberElement =
        document.getElementById(
            "number"
        );


    const startButton =
        document.getElementById(
            "startButton"
        );


    const messageElement =
        document.getElementById(
            "message"
        );


    const scoreElement =
        document.getElementById(
            "score"
        );


    const lineUserElement =
        document.getElementById(
            "lineUser"
        );


    const liffStatusElement =
        document.getElementById(
            "liffStatus"
        );


    // ==================================================
    // 页面加载
    // ==================================================

    window.addEventListener(
        "load",
        initializeLIFF
    );


    // ==================================================
    // 初始化 LIFF
    // ==================================================

    async function initializeLIFF() {

        try {

            liffStatusElement.textContent =
                "LIFFを初期化しています...";


            // ------------------------------------------
            // 初始化 LIFF
            // ------------------------------------------

            await liff.init({

                liffId: LIFF_ID

            });


            console.log(
                "LIFF initialized"
            );


            // ------------------------------------------
            // 判断登录状态
            // ------------------------------------------

            if (!liff.isLoggedIn()) {

                liffStatusElement.textContent =
                    "LINEにログインしています...";


                liff.login();

                return;
            }


            // ------------------------------------------
            // 获取 LINE 用户资料
            // ------------------------------------------

            const profile =
                await liff.getProfile();


            console.log(
                "LINE User ID:",
                profile.userId
            );


            console.log(
                "LINE Display Name:",
                profile.displayName
            );


            // ------------------------------------------
            // 显示用户名称
            // ------------------------------------------

            lineUserElement.textContent =
                "こんにちは、" +
                profile.displayName +
                "さん！";


            liffStatusElement.textContent =
                "LINE接続OK";


        } catch (error) {


            console.error(
                "LIFF Error:",
                error
            );


            lineUserElement.textContent =
                "LINEユーザー情報を取得できませんでした";


            liffStatusElement.textContent =
                "LIFF Error";


            messageElement.textContent =
                "LIFFの初期化に失敗しました";

        }

    }


    // ==================================================
    // START 按钮
    // ==================================================

    startButton.addEventListener(
        "click",
        function() {


            // ------------------------------------------
            // 生成 1～100 的随机数字
            // ------------------------------------------

            const randomNumber =

                Math.floor(
                    Math.random() * 100
                ) + 1;


            // ------------------------------------------
            // 显示数字
            // ------------------------------------------

            numberElement.textContent =
                randomNumber;


            // ------------------------------------------
            // 加分
            // ------------------------------------------

            score += 10;


            scoreElement.textContent =
                score;


            // ------------------------------------------
            // 消息
            // ------------------------------------------

            messageElement.textContent =
                "ナイス！ +10 POINT";

        }
    );


</script>


</body>

</html>
