<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>時代を見破れ！</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            padding: 20px;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    #d8c7a8,
                    #eee2c8
                );

            font-family:
                Arial,
                "Noto Sans JP",
                sans-serif;
        }


        /* =========================
           游戏整体
        ========================= */

        .game {

            width: 100%;

            max-width: 500px;

            background: #fff;

            padding: 20px;

            border-radius: 20px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.15);

            text-align: center;
        }


        /* =========================
           标题
        ========================= */

        h1 {

            margin:
                0 0 5px 0;

            font-size: 28px;
        }


        .subtitle {

            margin-top: 0;

            color: #666;

            font-size: 14px;
        }


        /* =========================
           信息栏
        ========================= */

        .info {

            display: flex;

            justify-content: space-between;

            margin: 15px 0;

            padding: 10px 15px;

            background: #f3f3f3;

            border-radius: 10px;

            font-weight: bold;
        }


        /* =========================
           游戏场景
        ========================= */

        #scene {

            position: relative;

            width: 100%;

            height: 330px;

            overflow: hidden;

            border-radius: 15px;

            border:
                4px solid #6b5845;

            background:
                #d7c5a5;

            user-select: none;
        }


        /* 天空 */

        .sky {

            position: absolute;

            left: 0;

            top: 0;

            width: 100%;

            height: 55%;

            background:
                linear-gradient(
                    #b8d0d8,
                    #e7dcc4
                );
        }


        /* 地面 */

        .ground {

            position: absolute;

            left: 0;

            bottom: 0;

            width: 100%;

            height: 45%;

            background:
                repeating-linear-gradient(
                    0deg,
                    #8c8170 0px,
                    #8c8170 8px,
                    #817666 8px,
                    #817666 16px
                );
        }


        /* =========================
           建筑物
        ========================= */

        .building {

            position: absolute;

            left: 20px;

            bottom: 120px;

            width: 150px;

            height: 150px;

            background: #b65f42;

            border:
                3px solid #70402e;
        }


        .building-roof {

            position: absolute;

            left: -15px;

            top: -25px;

            width: 180px;

            height: 30px;

            background: #4b4038;

            border-radius: 5px;
        }


        .window {

            position: absolute;

            width: 35px;

            height: 45px;

            background: #d8c98d;

            border:
                3px solid #593e32;
        }


        .window1 {

            left: 20px;

            top: 30px;
        }


        .window2 {

            right: 20px;

            top: 30px;
        }


        .door {

            position: absolute;

            left: 58px;

            bottom: 0;

            width: 40px;

            height: 70px;

            background: #543b30;
        }


        /* =========================
           电线杆
        ========================= */

        .pole {

            position: absolute;

            right: 60px;

            bottom: 100px;

            width: 10px;

            height: 190px;

            background: #4c443e;
        }


        .pole-top {

            position: absolute;

            right: 40px;

            top: 40px;

            width: 60px;

            height: 8px;

            background: #4c443e;
        }


        /* =========================
           自行车
        ========================= */

        .bicycle {

            position: absolute;

            left: 205px;

            bottom: 45px;

            width: 80px;

            height: 70px;
        }


        .wheel {

            position: absolute;

            bottom: 0;

            width: 35px;

            height: 35px;

            border:
                4px solid #222;

            border-radius: 50%;
        }


        .wheel1 {

            left: 0;
        }


        .wheel2 {

            right: 0;
        }


        .bike-frame {

            position: absolute;

            left: 17px;

            top: 20px;

            width: 45px;

            height: 25px;

            border:
                4px solid #333;

            transform:
                skew(-20deg);
        }


        /* =========================
           人
        ========================= */

        .person {

            position: absolute;

            right: 120px;

            bottom: 55px;

            font-size: 50px;
        }


        /* =========================
           手机
        ========================= */

        .smartphone {

            position: absolute;

            right: 25px;

            bottom: 65px;

            width: 55px;

            height: 90px;

            background: #111;

            border:
                4px solid #333;

            border-radius: 9px;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 30px;

            cursor: pointer;

            transition:
                transform 0.15s;
        }


        .smartphone:hover {

            transform:
                scale(1.08);
        }


        /* =========================
           点击提示
        ========================= */

        .hint {

            margin-top: 15px;

            font-size: 16px;

            font-weight: bold;
        }


        /* =========================
           结果
        ========================= */

        #result {

            display: none;

            margin-top: 20px;

            padding: 20px;

            background: #f5f0e5;

            border-radius: 15px;
        }


        #result h2 {

            margin-top: 0;

            font-size: 28px;
        }


        /* =========================
           按钮
        ========================= */

        button {

            width: 100%;

            height: 55px;

            margin-top: 15px;

            border: none;

            border-radius: 10px;

            background: #222;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }


        button:active {

            transform:
                scale(0.98);
        }


        /* =========================
           错误提示
        ========================= */

        #message {

            min-height: 25px;

            margin: 10px 0 0;

            font-weight: bold;
        }


        .wrong {

            animation:
                shake 0.25s;
        }


        @keyframes shake {

            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            50% {
                transform: translateX(8px);
            }

            75% {
                transform: translateX(-8px);
            }

            100% {
                transform: translateX(0);
            }
        }


        /* =========================
           手机适配
        ========================= */

        @media (max-width: 400px) {

            .game {

                padding: 15px;
            }

            #scene {

                height: 280px;
            }

            .building {

                transform:
                    scale(0.8);

                transform-origin:
                    bottom left;
            }

            .person {

                right: 90px;

                font-size: 40px;
            }

            .bicycle {

                left: 150px;

                transform:
                    scale(0.8);
            }

            .smartphone {

                right: 18px;

                bottom: 55px;
            }
        }

    </style>

</head>


<body>


<div class="game">

    <h1>時代を見破れ！</h1>

    <p class="subtitle">
        昭和の街に「ありえない物」が1つあります
    </p>


    <!-- 游戏信息 -->

    <div class="info">

        <div>
            STAGE：1
        </div>

        <div>
            SCORE：
            <span id="score">0</span>
        </div>

    </div>


    <!-- 游戏场景 -->

    <div id="scene">

        <!-- 天空 -->

        <div class="sky"></div>


        <!-- 建筑 -->

        <div class="building">

            <div class="building-roof"></div>

            <div class="window window1"></div>

            <div class="window window2"></div>

            <div class="door"></div>

        </div>


        <!-- 电线杆 -->

        <div class="pole">

            <div class="pole-top"></div>

        </div>


        <!-- 自行车 -->

        <div class="bicycle">

            <div class="wheel wheel1"></div>

            <div class="wheel wheel2"></div>

            <div class="bike-frame"></div>

        </div>


        <!-- 人 -->

        <div class="person">
            🧑
        </div>


        <!-- 手机 -->

        <div
            id="smartphone"
            class="smartphone"
            title="スマートフォン"
        >
            📱
        </div>


        <!-- 地面 -->

        <div class="ground"></div>

    </div>


    <p class="hint">
        この時代に存在しない物をタップしてください
    </p>


    <p id="message">
        どこかに「時代違い」の物があります…
    </p>


    <!-- 重新开始 -->

    <div id="result">

        <h2>正解！🎉</h2>

        <p>
            スマートフォンは昭和時代には存在しません。
        </p>

        <p>
            +100 POINT
        </p>

        <button id="restartButton">
            もう一度プレイ
        </button>

    </div>


</div>


<script>


    // =========================
    // 游戏变量
    // =========================

    let score = 0;

    let gameFinished = false;


    // =========================
    // 获取 HTML 元素
    // =========================

    const smartphone =
        document.getElementById("smartphone");

    const scene =
        document.getElementById("scene");

    const message =
        document.getElementById("message");

    const scoreElement =
        document.getElementById("score");

    const result =
        document.getElementById("result");

    const restartButton =
        document.getElementById("restartButton");


    // =========================
    // 点击手机
    // =========================

    smartphone.addEventListener(
        "click",
        function(event) {

            // 防止点击事件传到场景
            event.stopPropagation();


            if (gameFinished) {

                return;
            }


            // 正确答案

            score += 100;

            scoreElement.textContent =
                score;


            message.textContent =
                "正解！スマートフォンは昭和にはありません！";


            message.style.color =
                "#008000";


            gameFinished = true;


            // 显示结果

            result.style.display =
                "block";


            // 手机消失

            smartphone.style.display =
                "none";
        }
    );


    // =========================
    // 点击其他地方
    // =========================

    scene.addEventListener(
        "click",
        function() {

            if (gameFinished) {

                return;
            }


            // 错误

            score -= 20;

            scoreElement.textContent =
                score;


            message.textContent =
                "違います！もう一度探してください。";


            message.style.color =
                "#d00000";


            // 摇晃效果

            scene.classList.remove(
                "wrong"
            );


            // 强制重新触发动画

            void scene.offsetWidth;


            scene.classList.add(
                "wrong"
            );

        }
    );


    // =========================
    // 重新开始
    // =========================

    restartButton.addEventListener(
        "click",
        function() {

            score = 0;

            scoreElement.textContent =
                score;


            gameFinished = false;


            message.textContent =
                "どこかに「時代違い」の物があります…";


            message.style.color =
                "#222";


            smartphone.style.display =
                "flex";


            result.style.display =
                "none";

        }
    );


</script>


</body>

</html>
