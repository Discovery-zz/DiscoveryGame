<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DiscoveryGame LIFF Test</title>

    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .box {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .value {
            word-break: break-all;
            line-height: 1.6;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <h1>DiscoveryGame</h1>

    <!-- LIFF Status -->
    <div class="box">
        <div class="title">
            LIFF Status
        </div>

        <div id="liffStatus" class="value">
            初期化中...
        </div>
    </div>


    <!-- LINE User -->
    <div class="box">
        <div class="title">
            LINE User
        </div>

        <div id="lineUser" class="value">
            取得中...
        </div>
    </div>


    <!-- Login Status -->
    <div class="box">
        <div class="title">
            Login Status
        </div>

        <div id="loginStatus" class="value">
            確認中...
        </div>
    </div>


    <!-- Granted Permissions -->
    <div class="box">
        <div class="title">
            Granted Permissions
        </div>

        <div id="permissions" class="value">
            確認中...
        </div>
    </div>


    <!-- LIFF Context -->
    <div class="box">
        <div class="title">
            LIFF Context
        </div>

        <div id="context" class="value">
            確認中...
        </div>
    </div>


    <!-- Error -->
    <div class="box">
        <div class="title">
            Error
        </div>

        <div id="error" class="value">
            なし
        </div>
    </div>


<script>

    // ==========================================
    // LIFF ID
    // ==========================================

    const LIFF_ID = "2011739996-nl92Poky";


    // ==========================================
    // HTML Elements
    // ==========================================

    const liffStatusElement =
        document.getElementById("liffStatus");

    const lineUserElement =
        document.getElementById("lineUser");

    const loginStatusElement =
        document.getElementById("loginStatus");

    const permissionsElement =
        document.getElementById("permissions");

    const contextElement =
        document.getElementById("context");

    const errorElement =
        document.getElementById("error");


    // ==========================================
    // Start
    // ==========================================

    window.addEventListener(
        "load",
        initializeLIFF
    );


    // ==========================================
    // LIFF Initialization
    // ==========================================

    async function initializeLIFF() {

        try {

            console.log("================================");
            console.log("LIFF START");
            console.log("LIFF ID:", LIFF_ID);
            console.log("================================");


            // ----------------------------------
            // 1. LIFF Initialize
            // ----------------------------------

            liffStatusElement.textContent =
                "LIFFを初期化しています...";

            await liff.init({
                liffId: LIFF_ID
            });

            console.log(
                "LIFF initialized successfully"
            );

            liffStatusElement.textContent =
                "LIFF初期化OK";

            liffStatusElement.className =
                "value success";


            // ----------------------------------
            // 2. Login Status
            // ----------------------------------

            const loggedIn =
                liff.isLoggedIn();

            console.log(
                "isLoggedIn:",
                loggedIn
            );

            if (loggedIn) {

                loginStatusElement.textContent =
                    "ログイン済み";

                loginStatusElement.className =
                    "value success";

            } else {

                loginStatusElement.textContent =
                    "ログインしていません";

                loginStatusElement.className =
                    "value error";
            }


            // ----------------------------------
            // 3. LIFF Context
            // ----------------------------------

            try {

                const context =
                    liff.getContext();

                console.log(
                    "LIFF Context:",
                    context
                );

                if (context) {

                    contextElement.textContent =
                        JSON.stringify(
                            context,
                            null,
                            2
                        );

                } else {

                    contextElement.textContent =
                        "Context is null";
                }

            } catch (contextError) {

                console.error(
                    "getContext error:",
                    contextError
                );

                contextElement.textContent =
                    "Context取得エラー: " +
                    contextError.message;
            }


            // ----------------------------------
            // 4. Granted Permissions
            // ----------------------------------

            try {

                const permissions =
                    await liff.permission.getGrantedAll();

                console.log(
                    "Granted permissions:",
                    permissions
                );

                if (
                    permissions &&
                    permissions.length > 0
                ) {

                    permissionsElement.textContent =
                        permissions.join(", ");

                } else {

                    permissionsElement.textContent =
                        "許可された権限なし";
                }

            } catch (permissionError) {

                console.error(
                    "Permission error:",
                    permissionError
                );

                permissionsElement.textContent =
                    "Permission取得エラー: " +
                    (
                        permissionError.message ||
                        permissionError
                    );
            }


            // ----------------------------------
            // 5. Get LINE Profile
            // ----------------------------------

            try {

                console.log(
                    "Getting LINE profile..."
                );

                const profile =
                    await liff.getProfile();

                console.log(
                    "LINE Profile:",
                    profile
                );


                // Display Name
                lineUserElement.innerHTML =
                    "Display Name: " +
                    profile.displayName +
                    "<br><br>" +

                    "User ID: " +
                    profile.userId;

                lineUserElement.className =
                    "value success";


            } catch (profileError) {

                console.error(
                    "getProfile error:",
                    profileError
                );

                lineUserElement.textContent =
                    "Profile取得失敗";

                lineUserElement.className =
                    "value error";


                errorElement.textContent =
                    "Code: " +
                    (
                        profileError.code ||
                        "unknown"
                    ) +
                    " / Message: " +
                    (
                        profileError.message ||
                        profileError
                    );

                errorElement.className =
                    "value error";
            }


        } catch (error) {

            // ==================================
            // LIFF Initialization Error
            // ==================================

            console.error(
                "LIFF initialization error:",
                error
            );


            liffStatusElement.textContent =
                "LIFF初期化失敗";

            liffStatusElement.className =
                "value error";


            errorElement.textContent =
                "Code: " +
                (
                    error.code ||
                    "unknown"
                ) +
                " / Message: " +
                (
                    error.message ||
                    error
                );

            errorElement.className =
                "value error";
        }

    }

</script>

</body>

</html>
